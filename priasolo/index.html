		//================ sound spx =================
var audioPool = {};
var MAX_CHANNEL = 5;

function playSfx(name){

    var src = game.folder + "/" + suara[name];

    if (!audioPool[name]){
        audioPool[name] = [];
    }

    // cari channel kosong
    for (var i = 0; i < audioPool[name].length; i++){
        var a = audioPool[name][i];

        if (a.ended || a.paused){
            try {
                a.pause();
                a.currentTime = 0;
                a.play();
            } catch(e){}
            return;
        }
    }

    // kalau belum penuh → tambah
    if (audioPool[name].length < MAX_CHANNEL){

        var a = new Audio(src);

        a.preload = "auto";
        a.volume = 0.5;

        a.play();

        audioPool[name].push(a);
    } else {
        // kalau penuh → paksa pakai yang pertama (biar gak noise)
        var a0 = audioPool[name][0];
        try {
            a0.pause();
            a0.currentTime = 0;
            a0.play();
        } catch(e){}
    }
}
//================ sound bgm =================
	
	var bgm = null;
var currentBgm = "";

function playBgm(name){

    var src = game.folder + "/" + suara[name];

    // kalau sama, jangan restart
    if (currentBgm === name) return;

    // stop musik lama
    if (bgm){
        bgm.pause();
        bgm.currentTime = 0;
    }

    // buat musik baru
    bgm = new Audio(src);
    bgm.loop = true;
    bgm.volume = 0.5;
    bgm.play();

    currentBgm = name;
}

//================ RESET =================

function ulangiPermainan(){

    game.nyawa--;

    if(game.nyawa <= 0){

        game.level = 1;
        game.score = 0;
        game.nyawa = 5;
    }

    game.aktif = true;

    setAwal();

    jalankan(gameLoop);
}


//================ GAME LOOP ================

function gameLoop(){

	hapusLayar();
    tampilkanGuide();
	// background
	latar(game.bgSekarang,0,0);
	
	// ================= WORLD =================
	
	buatLevel();

	updatePeluru4();
	updatePeluru5();
	updatePeluru6();
	updatePeluru7();
	// ================= RESET INPUT =================
	game.kiri = false;
	game.kanan = false;
	game.atas = false;

	// ================= UI =================
	
	var W = 1200;
var H = 600;
	
	var UI = {
	kiriX: 0.15,   // 15% dari layar
	kananX: 0.28,
	jumpX: 0.85,
	y: 0.88        // 88% dari tinggi layar (dekat bawah)
};
	
var kiriX  = W * UI.kiriX;
var kananX = W * UI.kananX;
var jumpX  = W * UI.jumpX;
var tombolY = H * UI.y;	
	
var btnKiri  = tombol(dataGambar.tombolKiri, kiriX, tombolY, 2);
var btnKanan = tombol(dataGambar.tombolKanan, kananX, tombolY, 2);
var btnJump  = tombol(dataGambar.tombolJump, jumpX, tombolY, 2);

// ================= TOUCH =================
if (game.mouseDitekan) {

	if (jarak(game.mouse.x, game.mouse.y, kiriX, tombolY) < 70) {
		game.kiri = true;
	}

	if (jarak(game.mouse.x, game.mouse.y, kananX, tombolY) < 70) {
		game.kanan = true;
	}

	if (jarak(game.mouse.x, game.mouse.y, jumpX, tombolY) < 80) {
		game.atas = true;
	}
}

	// ================= KEYBOARD =================
	if (kiri)  game.kiri = true;
	if (kanan) game.kanan = true;
	if (atas)  game.atas = true;

	// ================= PLAYER MOVEMENT =================
	if (game.kanan){
		gerakLevel(game.hero,3,0);
	}
	else if (game.kiri){
		gerakLevel(game.hero,-3,0);
	}

	if (game.atas){
		gerakLevel(game.hero,0,-10);
		 playSfx("spx1");
	}



	cekItem();

	// ================= UI TEXT =================
	
	tampilkanUI();
	
	
	efekTransisi();
}

function cekNyawaBonus(){

    while(
        game.score >= 1000 &&
        game.nyawa < 10
    ){

        game.score -= 1000;
        game.nyawa++;

    }
}	
	
function cekItem(){

	//item 1
	if (game.itemID == 1){

		tambahScore(10);
		cekNyawaBonus();
playSfx("spx3");
		game.itemID = 0;
	}

	//item 2
	else if (game.itemID == 2){

		tambahScore(5);
		cekNyawaBonus();
 playSfx("spx3");
		game.itemID = 0;
	}

	//item 3
	else if (game.itemID == 3){

		tambahScore(1000);
		cekNyawaBonus();
playSfx("spx3");
		game.itemID = 0;
	}

	//naik level

    game.triggerID = 0;

    game.aktif = false;

    setTimeout(function(){

        transisi("out", gantiLevel);

    }, 2000); // 2 detik
}
}
	
	function gantiLevel(){

    game.level++;

    setAwal();

    transisi("in");
}
